name: Build and Release Debian Package

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

on:
  push:
    paths:
      - Cargo.toml
  schedule:
    # Check daily for new nginx releases
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if version exists'
        required: false
        type: boolean

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    outputs:
      needs_release: ${{ steps.check.outputs.needs_release }}
      nginx_version: ${{ steps.check.outputs.nginx_version }}
      hibernator_version: ${{ steps.check.outputs.hibernator_version }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      pkg_version: ${{ steps.check.outputs.pkg_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new nginx version
        id: check
        run: |
          HIBERNATOR_VERSION="$(awk -F'"' '/^version\s*=\s*"/ {print $2; exit}' Cargo.toml)"
          test -n "$HIBERNATOR_VERSION"

          # Get current nginx version from Debian trixie
          NGINX_VERSION=$(apt-cache policy nginx 2>/dev/null | grep Candidate | awk '{print $2}' || curl -s https://packages.debian.org/trixie/nginx | grep -oP 'nginx/\K[0-9.]+' | head -1)
          
          if [ -z "$NGINX_VERSION" ]; then
            NGINX_VERSION=$(curl -s https://packages.debian.org/trixie/nginx | grep -oP 'nginx/\K[0-9.]+' | head -1)
          fi
          
          RELEASE_TAG="v${HIBERNATOR_VERSION}-nginx-${NGINX_VERSION}"

          echo "nginx_version=$NGINX_VERSION" >> $GITHUB_OUTPUT
          echo "hibernator_version=$HIBERNATOR_VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          
          # Check if this hibernator+nginx combination is already released.
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1 && [ "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_release == 'true' }}" != "true" ]; then
            echo "needs_release=false" >> $GITHUB_OUTPUT
            echo "Version combination already released: $RELEASE_TAG"
          else
            echo "needs_release=true" >> $GITHUB_OUTPUT
            echo "Building release for $RELEASE_TAG"
          fi
          
          # Package version includes the nginx version
          PKG_VERSION="${NGINX_VERSION}-$(date +%s)"
          echo "pkg_version=$PKG_VERSION" >> $GITHUB_OUTPUT

  build:
    needs: check-and-build
    if: needs.check-and-build.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian package
        run: |
          ./scripts/debian-build.sh
          ls -lh target/docker/

      - name: Test package
        run: |
          timeout 120 ./test-debian.sh 2>&1 | tee test-output.log
          if grep -q "all tests passed" test-output.log; then
            echo "Tests passed!"
            exit 0
          else
            echo "Tests failed!"
            tail -100 test-output.log
            exit 1
          fi

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-output.log

      - name: Find built package
        id: pkg
        run: |
          PKG=$(find target/docker -maxdepth 1 -name '*.deb' -type f)
          echo "package=$PKG" >> $GITHUB_OUTPUT
          echo "filename=$(basename $PKG)" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-and-build.outputs.release_tag }}
          name: ${{ github.event.repository.name }} ${{ needs.check-and-build.outputs.hibernator_version }} for nginx v${{ needs.check-and-build.outputs.nginx_version }}
          body: |
            Built against nginx ${{ needs.check-and-build.outputs.nginx_version }} from Debian trixie
            
            ## Installation
            
            Add the APT repository from GitHub Pages:
            ```bash
            echo "deb [trusted=yes] https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ trixie main" | sudo tee /etc/apt/sources.list.d/nginx-hibernator.list
            sudo apt-get update
            sudo apt-get install nginx-hibernator-module
            ```
            
            Or install directly:
            ```bash
            sudo apt-get install ${{ steps.pkg.outputs.filename }}
            ```
          files: ${{ steps.pkg.outputs.package }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to releases for APT repo
        run: |
          mkdir -p apt-repo/pool/main/n/nginx-hibernator
          cp ${{ steps.pkg.outputs.package }} apt-repo/pool/main/n/nginx-hibernator/

      - name: Generate APT repository metadata
        run: |
          cd apt-repo
          
          # Create Packages file
          mkdir -p dists/trixie/main/binary-amd64
          dpkg-scanpackages --multiversion pool/main/ > dists/trixie/main/binary-amd64/Packages
          gzip -k dists/trixie/main/binary-amd64/Packages
          
          # Create Release file
          cat > dists/trixie/Release <<EOF
          Origin: nginx-hibernator
          Label: nginx-hibernator
          Suite: trixie
          Codename: trixie
          Version: 13.0
          Architectures: amd64
          Components: main
          Description: nginx-hibernator module packages
          EOF
          
          cd ..

      - name: Import APT signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_PRIVATE_KEY"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_FPR="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          test -n "$KEY_FPR"
          echo "key_fpr=$KEY_FPR" >> "$GITHUB_OUTPUT"

      - name: Sign APT repository metadata
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          cd apt-repo
          KEY_FPR="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')"
          test -n "$KEY_FPR"
          gpg --batch --yes --local-user "$KEY_FPR" --clearsign -o dists/trixie/InRelease dists/trixie/Release
          gpg --batch --yes --local-user "$KEY_FPR" --detach-sign -o dists/trixie/Release.gpg dists/trixie/Release
          gpg --armor --export > dists/trixie/repo-public.key

      - name: Generate APT repository landing page
        run: |
          cat > apt-repo/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>nginx-hibernator APT repository</title>
            <style>
              body{font-family:system-ui,Segoe UI,sans-serif;max-width:72ch;margin:4rem auto;padding:0 1.5rem;line-height:1.5;color:#222}
              code,pre{background:#f5f5f5;border-radius:.4rem}
              pre{padding:1rem;overflow:auto}
              a{color:#0b5cab}
            </style>
          </head>
          <body>
            <h1>nginx-hibernator APT repository</h1>
            <p>This GitHub Pages site hosts the Debian package repository.</p>
            <p>Repository key:</p>
            <pre>dists/trixie/repo-public.key</pre>
            <p>APT metadata:</p>
            <pre>dists/trixie/Release</pre>
            <p>Installation instructions are in the project README.</p>
          </body>
          </html>
          EOF

      - name: Upload APT repository artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apt-repo

      - name: Deploy APT repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [check-and-build, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Package successfully built and tested for nginx ${{ needs.check-and-build.outputs.nginx_version }}"
          elif [ "${{ needs.build.result }}" == "skipped" ]; then
            echo "⏭️  No new nginx version to build"
          else
            echo "❌ Build or tests failed"
            exit 1
          fi
