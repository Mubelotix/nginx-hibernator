<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            box-sizing: border-box;
            background: #101448;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        div {
            padding: 0.85rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            font-size: clamp(1rem, 2vw, 1.2rem);
            font-weight: 600;
            user-select: none;
        }
        @media (hover: hover) {
            div:hover {
                background: rgba(255, 255, 255, 0.25);
                transform: translateY(-2px);
            }
        }
    </style>
</head>
<body>
    <div>Enter Site</div>
    <script>
        (() => {
            let sent = false;
            const gate = document.querySelector("body > div");
            const enter = () => {
                if (sent) return;
                sent = true;
                fetch(location.href, { method: "POST", cache: "no-store" })
                    .then(response => response.text())
                    .then(html => {
                        document.open();
                        document.write(html);
                        document.close();
                    })
                    .catch(() => {
                        sent = false;
                    });
            };

            document.addEventListener("click", event => {
                if (event.target === gate) enter();
            });
        })();
    </script>
</body>
</html>
