[package]
name = "nginx-hibernator"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "hibernator"
crate-type = ["cdylib"]

[dependencies]
ngx = { version = "0.5", default-features = false, features = ["std", "vendored"] }
dbus = "0.9"
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "sync", "fs"] }
dbus-tokio = "0.7.6"

[features]
default = ["export-modules"]
export-modules = []
