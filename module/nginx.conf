daemon off;
master_process off;

# Update this path if your module is located elsewhere.
# The test script generates a runtime config with absolute paths automatically.
load_module modules/librandom_gate.so;

events {}

http {
    upstream backend {
        server 127.0.0.1:18081;
    }

    server {
        listen 127.0.0.1:18080;
        server_name localhost;

        location / {
            random_gate on;
            # Optional: override default embedded landing page by redirecting to this URI
            # random_gate_landing_uri /_landing;
            proxy_pass http://backend;
        }

        # location = /_landing {
        #     default_type text/html;
        #     return 200 '<!doctype html><html><body><h1>Waking up...</h1></body></html>';
        # }
    }
}
